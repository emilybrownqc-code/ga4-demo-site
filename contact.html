<header>
  <strong>Streamline</strong>
  <nav>
    <a href="index.html">Home</a>
    <a href="product.html">Product</a>
    <a href="pricing.html">Pricing</a>
    <a href="contact.html">Contact</a>
    <a href="blog.html">Blog</a>
  </nav>
</header>

<div class="content">
  <h1>Get in touch</h1>
  <p class="subhead">Tell us a bit about your team and we'll follow up.</p>

  <form id="contact-form" action="https://formspree.io/f/mzezakdw" method="POST">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="company">Company</label>
    <input type="text" id="company" name="company">

    <label for="message">Message</label>
    <textarea id="message" name="message"></textarea>

    <button type="submit">Send Message</button>
  </form>
</div>

<footer>&copy; 2026 Streamline Demo Site — built for portfolio purposes.</footer>

<script>
document.getElementById('contact-form').addEventListener('submit', function(e) {
  e.preventDefault();
  const form = e.target;
  const submitBtn = form.querySelector('button[type="submit"]');
  const data = new FormData(form);

  submitBtn.disabled = true;
  submitBtn.textContent = 'Sending...';

  fetch(form.action, {
    method: 'POST',
    body: data,
    headers: { 'Accept': 'application/json' }
  }).then(function(response) {
    if (response.ok) {
      window.location.href = 'thank-you.html';
    } else {
      alert('Oops! There was a problem submitting the form.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send Message';
    }
  }).catch(function() {
    alert('Oops! There was a problem submitting the form.');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Send Message';
  });
});
</script>

</body>
